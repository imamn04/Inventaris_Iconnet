version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: iconnet_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventaris_iconnet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./iventaris_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-inventaris_iconnet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iconnet_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iconnet_app
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-your_secure_password}@postgres:5432/${POSTGRES_DB:-inventaris_iconnet}?schema=public"
      CORS_ORIGIN: "*"
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_here}
    command: sh -c "npx prisma db push --skip-generate && node server.js"
    ports:
      - "3000:3000"
    volumes:
      - barcode_storage:/app/barcode
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iconnet_network

  nginx:
    image: nginx:alpine
    container_name: iconnet_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - barcode_storage:/var/www/barcode:ro
    depends_on:
      - app
    networks:
      - iconnet_network

networks:
  iconnet_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  barcode_storage:
    driver: local

